name: Validar e publicar portfólio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador de testes
        run: pnpm exec playwright install --with-deps chromium

      - name: Validar tipos e conteúdo
        run: pnpm check

      - name: Construir o site
        run: pnpm build

      - name: Testar navegação, filtros e acessibilidade
        run: pnpm test:e2e

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
